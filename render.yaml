databases:
  - name: aicte-db
    plan: free
    databaseName: aicte_db
    user: aicte_user

services:
  - type: web
    name: aicte-backend
    plan: free
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aicte-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: aicte-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: aicte-db
          property: password
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: JWT_REFRESH_EXPIRATION_MS
        value: "604800000"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: MAIL_HOST
        value: "smtp.gmail.com"
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: "demo@gmail.com"
      - key: MAIL_PASSWORD
        sync: false
      - key: AI_SERVICE_MODE
        value: "mock"
      - key: AI_API_KEY
        value: ""
      - key: UPLOAD_DIR
        value: "/app/uploads"

  - type: web
    name: aicte-frontend
    plan: free
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: VITE_BACKEND_URL
        value: https://aicte-backend-bs8n.onrender.com
