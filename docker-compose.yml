services:
  postgres:
    image: postgres:16-alpine
    container_name: aicte-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aicte_db}
      POSTGRES_USER: ${POSTGRES_USER:-aicte_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicte_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aicte_user} -d ${POSTGRES_DB:-aicte_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aicte-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: aicte-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aicte-network

  mailhog:
    image: axllent/mailpit:latest
    container_name: aicte-mailhog
    restart: always
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1025"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aicte-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicte-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
      minio:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aicte_db}
      DATABASE_USERNAME: ${POSTGRES_USER:-aicte_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-aicte_password}
      JWT_SECRET: ${JWT_SECRET:-aicte-demo-jwt-secret-key-minimum-32-characters-long-change-in-production}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-aicte-documents}
      AI_SERVICE_MODE: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - aicte-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aicte-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aicte-network

volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local

networks:
  aicte-network:
    driver: bridge
