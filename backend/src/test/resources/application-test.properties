# Test configuration using H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
jwt.secret=test-jwt-secret-key-minimum-32-characters-long-for-tests
jwt.expiration=86400000
jwt.refresh-expiration=604800000
app.storage.upload-dir=./test-uploads
app.document.allowed-extensions=pdf,jpg,jpeg,png,docx
app.document.max-file-size-mb=10
ai.service.mode=mock
spring.mail.host=localhost
spring.mail.port=1025
logging.level.com.aicte=DEBUG
