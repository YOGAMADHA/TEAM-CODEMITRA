# Development profile configuration
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aicte_db}
    username: ${DATABASE_USERNAME:aicte_user}
    password: ${DATABASE_PASSWORD:aicte_password}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: localhost
    port: 1025

ai:
  service:
    mode: mock

logging:
  level:
    com.aicte: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
