server:
  port: 
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aicte_db}
    username: ${DATABASE_USERNAME:aicte_user}
    password: ${DATABASE_PASSWORD:aicte_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: ${JWT_SECRET:aicte-demo-jwt-secret-key-minimum-32-characters-long-change-in-production}
  expiration: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  document:
    allowed-extensions: ${ALLOWED_EXTENSIONS:pdf,jpg,jpeg,png,docx}
    max-file-size-mb: ${MAX_FILE_SIZE_MB:10}

ai:
  service:
    mode: ${AI_SERVICE_MODE:mock}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: AICTE Approval Workflow Management System
    description: Prototype workflow management system for academic demonstration
    version: 1.0.0
    disclaimer: >
      This is a prototype workflow-management system for academic demonstration.
      It supports human-supervised administrative processing and does not replace
      official AICTE systems, statutory scrutiny, inspection, committee review,
      or competent-authority decisions.

logging:
  level:
    com.aicte: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
