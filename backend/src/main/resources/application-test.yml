# Test profile configuration
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 1025

jwt:
  secret: test-jwt-secret-key-minimum-32-characters-long-for-tests
  expiration: 86400000
  refresh-expiration: 604800000

app:
  storage:
    upload-dir: ./test-uploads
  document:
    allowed-extensions: pdf,jpg,jpeg,png,docx
    max-file-size-mb: 10

ai:
  service:
    mode: mock

logging:
  level:
    com.aicte: WARN
